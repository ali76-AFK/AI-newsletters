version: "3.9"

services:
  db:
    image: postgres:16
    container_name: newsletter_db
    restart: unless-stopped
    env_file:
      - ./env/db.env
    ports:
      - "55432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: newsletter_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 5000

volumes:
  pg_data:
